ground_truth:
  expected_reason_code: RC_1064
  expected_sufficiency: STRONG
  expected_decision: ESCALATE
  rationale: 'Both artifacts are of accepted types and both are individually valid, but they cannot both
    be true as a defence: the merchant claims delivery and simultaneously evidences a full refund. A critical
    contradiction is not something to resolve automatically — it needs human review before anything is
    filed.'
  source_rule: OC 208 §C (RC 1064 evidence table); OC 208 §C(b) auto-loss conditions
