  rationale: The declaration substitution is confined to small and offline merchants. For a large merchant,
    documentary evidence per the reason code is mandatory and a declaration does not replace it, so no
    accepted evidence is on file for RC 1085.
  source_rule: OC 208 §C(a) (declaration does not substitute for a large merchant); OC 172
