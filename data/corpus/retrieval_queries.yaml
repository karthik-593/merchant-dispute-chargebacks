    - version: "retrieval-v1.1"
      date: "2026-09-08"
      supersedes: "retrieval-v1"
      queries_amended: ["q25"]
      queries_unchanged: 25
      change: "q25.target_doc_ids gains `oc_208a_annexure_a_reject_taxonomy_curated`, listed
               before the OCR'd body. Nothing else about q25 changes: question, topic,
               target_section and answer_anchors are byte-identical."
      why: "The curated record post-dates the original freeze - it was created when OC 208A
            Annexure A was reconciled against the verified rulebook, 15 of its 28 reject codes
            having been damaged by OCR. It carries q25's anchor ('generic statements', code
            1142) and superseded the OCR'd body for retrieval, so it ranked at or above the
            listed target in 11 of 21 grid configurations while counting as a non-target. The
            query was penalising the system for retrieving the corrected source."
      convention: "Listing a curated table beside the OCR'd body of the same circular is the
                   existing pattern: q01-q08 name oc_208_sec_c_evidence_map_curated alongside
                   OC 208, and q12-q14 name oc_184b_rgnb_response_table_curated alongside
