  regression_guard_count: 2
  corpus: "data/corpus/circulars.jsonl"
  note: "Targets derive from the corpus and the domain spec. Anchors are matched
         case-insensitively against chunk text, with whitespace collapsed."

  # Content hashes over the LOADED queries, canonical JSON, sorted keys. They fingerprint what a
  # query means, not how the YAML is wrapped: re-folding a question or moving a comment leaves
  # them untouched, while any change to an id, question, target, anchor or topic moves them.
  # `tests/test_query_freeze.py` recomputes all three and fails if any drifts.
  queries_sha256: "d0be53a26ecabd890176968f474ee52a71f012519c8bb21f84418decd61b22b8"
  discriminators_sha256: "758930cf826ee4793cd4ef366e1311702ae1c0dec2991209a0c74bfc5131f363"
  unamended_sha256: "1d1a30bbebb5d19c3cd0fffad680a96d90b3c1482bf997915f14c0f8ec98c212"
  unamended_note: "Hash over the 25 queries NOT touched in v1.1, in file order. It is identical
                   to the same 25 under retrieval-v1, which is what 'the rest of the set did not
                   move' means here and is asserted rather than claimed."

  # Continuity across the v1.2 schema change, and the reason it needs its own hash.
  #
  # v1.2 adds `class` and `role` to EVERY query, which moves the full fingerprint of all 26
  # carried-over queries while changing what none of them scores. So the continuity claim is made
  # over the fields that decide scoring - id, question, topic, target_doc_ids, target_section,
  # answer_anchors - and nothing else. That hash is identical to v1.1's full hash of the same 26,
  # because under v1.1 those WERE all the fields. Asserted in test_query_freeze.py.
  carried_over_scoring_sha256: "257b38f5ba184b13ef4f8f64b69177e12a9314c588cfd146f5d0c5e3297a4151"

