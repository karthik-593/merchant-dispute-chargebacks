    - version: "retrieval-v1.2"
      date: "2026-09-08"
      supersedes: "retrieval-v1.1"
      queries_added: 26
      discriminators_added: 24
      regression_guards_added: 2
      queries_amended: []
      change: "26 hard queries appended: 24 discriminators and 2 regression guards. Every query in
               the set, old and new, gains `class` and `role`. No existing query's scoring content
               was touched - see meta.carried_over_scoring_sha256, which is byte-identical to
               v1.1's hash of the same 26."
      why: "26 queries made one query worth 0.038, which is wider than most of the margins the M7
            grid was being read on. The set is now 50 discriminators, so one query is 0.02, and
            roughly half of them are hard: 24 of the 24 added discriminators have their answer
            outside the top 5 under both finalist configurations."
      weighting: "Near-duplicate by design - 19 of the 24 added discriminators. The failure mode
                  worth measuring on this corpus is a wrong near-identical row winning: ND1 vs
                  ND2, NA1 vs NA2, NR1/NR2/NR3, CD1 vs CD2, RC_1064 vs RC_1065 (identical
                  evidence lists), RC_108 U2 vs U3, and the 1130-1157 reject rows, several of
                  which differ by a single clause."
      targets_computed: "target_doc_ids on the new queries were DERIVED by anchor containment, not
                         hand-listed: a document is a target only if it contains every anchor.
                         This is the q19/q21/q22 rule applied forward - listing a document that
                         cannot answer would let Recall@K credit retrieving it. The derivation is
                         re-run and asserted in tests/test_query_freeze.py, so a corpus change
                         that moves an anchor fails the test rather than silently rotting a
                         target. It also produced a result hand-listing would have got wrong: the
                         RGNB queries target ONLY the curated table, because OC 184B's scanned
                         body never contained those codes - page 3 is a rotated table OCR
                         destroyed."
      reconciliation_only: "h32, h34, h35 and h36 anchor on codes that were unanchorable at any
                            quality before the OC 208A reconciliation: 1136, 1132 and 1154 were
                            absent from the scan, and 1155 read 'TAN details'. This is coverage
                            that did not exist before Part A, and three of the four sit outside
                            the top 50 under both sentence-chunked finalists."
      regression_guards: "h21 and h33 are tripwires, not discriminators, and are excluded from
                          every aggregate by default (ScoreCard.scored). h33 specifically guards
                          the corpus reconciliation: it anchors on 'Illegible evidence', which
                          exists only in the curated record - the scan reads 'Ilagible'. If a
                          rebuild ever loses the reconciliation, h33 stops matching and regresses.
                          That is the whole point of it."
      not_added: "h08, h11, h26 and h37 were drafted and rejected: the system already answers them
                  at rank 1-4, so they would add coverage but no discrimination."
      id_scheme: "New queries keep their h-prefixed draft ids rather than being renumbered into
                  the q-series, so review comments stay traceable. The gaps (h06-h08, h11, h17,
                  h19, h26, h28, h29, h31, h37) are drafts that did not survive review."
      metric_effect: "Expected to LOWER every headline, by design: the set is now roughly half
                      hard. Numbers taken on v1 or v1.1 are not comparable to numbers taken on
                      v1.2 and are marked stale in experiments/EXP-RETRIEVAL-001.md rather than
                      deleted."
