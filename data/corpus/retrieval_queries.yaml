                   existed."
      not_amended: "q19, q21 and q22 also name a circular that now has a curated record, and
                    were deliberately left alone. Those records cover a DIFFERENT section of the
                    same circular - Annexure A's reject codes, and SecC's evidence map - and do
                    not contain those queries' anchors ('5 calendar days', '500', '3,000').
                    Adding them would let Recall@K credit retrieval of a document that provably
                    cannot answer the question. The convention is 'the curated record covers the
                    section the query asks about', not 'the curated record supersedes any target'."
      metric_effect: "Scoped claim, measured rather than assumed: no metric regressed AS A RESULT
                      OF THIS AMENDMENT. Separately, the corpus reconciliation that preceded it
                      (35 -> 36 documents) did move 11 of 21 grid cells in both directions; that
