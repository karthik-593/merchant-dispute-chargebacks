# retrieval_queries.yaml — the scoring target for retrieval experiments.
#
# Hand-labelled, and FROZEN before any chunker was tuned. Building the queries after seeing which
# chunker wins would let the target drift toward whatever the chunker happens to do well, which
# is how a chunking experiment quietly stops measuring anything.
#
# Each query names:
#   target_doc_ids  — a retrieved chunk from any of these counts as a document-level hit. Where a
#                     curated record and the OCR'd body of the same circular both answer, both are
#                     listed: the question is which chunker surfaces the answer, not which record
#                     the corpus happens to hold it in.
#   target_section  — the human label for where the answer lives. Descriptive, for reading the
#                     results; the scoring uses the anchors.
#   answer_anchors  — literal strings, matched case-insensitively, that a chunk must ALL contain
#                     to count as actually carrying the answer. This is what separates "retrieved
#                     the right document" from "retrieved the passage that answers the question",
#                     which is the whole point of comparing chunkers.
#
# Every anchor was checked against the corpus text it targets before this set was frozen, so
# every query is answerable by at least one chunk under at least one chunking strategy.

meta:
  version: "retrieval-v1"
  frozen: true
  query_count: 26
  corpus: "data/corpus/circulars.jsonl"
  note: "Targets derive from the corpus and the domain spec. Anchors are matched
         case-insensitively against chunk text, with whitespace collapsed."

