[project]
name = "merchant-dispute-chargebacks"
version = "0.1.0"
description = "Evidence-grounded, cost-sensitive multi-agent system for UPI merchant-dispute chargebacks"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
# Heavier ML/serving dependencies are added per phase, not up front (M0 keeps runtime minimal).
dev = [
    "dvc>=3.51",
    "mlflow>=2.13",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
# Build environments from uv-managed interpreters only, so the project never
# picks up a local Anaconda/system Python and stays reproducible across machines.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["refs", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
