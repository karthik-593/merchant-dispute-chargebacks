[project]
name = "merchant-dispute-chargebacks"
version = "0.1.0"
description = "Evidence-grounded, cost-sensitive multi-agent system for UPI merchant-dispute chargebacks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "pydantic>=2.7",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.6",
    "uvicorn>=0.52.4",
]

[dependency-groups]
# Heavier ML/serving dependencies are added per phase, not up front (M0 keeps runtime minimal).
dev = [
    "dvc>=3.51",
    "httpx>=0.28.1",
    "mlflow>=2.13",
    "pytest>=8.2",
    "ruff>=0.5",
]

# Dense retrieval runs on the local RTX 4060 (8 GB, Ada/sm_89), so torch comes from the CUDA
# 12.6 wheel index rather than PyPI's CPU default. M7 itself would be happy on CPU - the index is
# a few hundred chunks - but the latency numbers that feed the M7 trade-off should be measured on
# the hardware the system will actually run on, and M8 needs the GPU regardless.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.uv]
# Build environments from uv-managed interpreters only, so the project never
# picks up a local Anaconda/system Python and stays reproducible across machines.
python-preference = "only-managed"
# Keep the cache on the same filesystem as .venv so uv can hardlink instead of
# copying every wheel. Machine-local build artifact — git-ignored, never committed.
cache-dir = ".uv-cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["refs", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
