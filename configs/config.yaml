# config.yaml — runtime configuration for the UPI dispute agent.
# Domain RULES do not live here; they live in configs/rulebook/*.yaml with a `source` tag.
# This file holds only paths, seeds, tracking, and logging.

project:
  name: merchant-dispute-chargebacks
  milestone: M0

seed: 42

paths:
  configs: configs
  rulebook: configs/rulebook
  data: data
  seed_data: data/seed
  refs: refs/circulars
  experiments: experiments
  artifacts: data/artifacts

mlflow:
  # MLflow 3.x puts the ./mlruns file store in maintenance mode and refuses to write to it,
  # so runs go to a local SQLite backend. Browse with: mlflow ui --backend-store-uri sqlite:///mlflow.db
  tracking_uri: sqlite:///mlflow.db
  experiment_name: upi-dispute-agent

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  datefmt: "%Y-%m-%dT%H:%M:%S"
