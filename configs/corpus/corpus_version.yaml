# corpus_version.yaml — the version of the ingested circulars corpus, and why each one moved.
#
# The corpus is a scoring input, not just data on disk: a retrieval number is only comparable to
# another if both were taken over the same corpus. Query-set versions were already tracked this
# way; this closes the other half, so a result can name both.
#
# A version bumps when the TEXT a retriever sees changes — new records, corrected records, or a
# change to how a curated record is rendered. Re-running OCR that reproduces the same bytes does
# not bump it.

version: "corpus-v1.4"
chunker_note: "corpus-v1.2 is also the first corpus scored under the corrected structure_aware
               merge floor - see the corpus-v1.2b entry. The corpus TEXT did not change; the
               chunker did, and the two are recorded together because a retrieval number depends
               on both."

history:
  - version: "corpus-v1.0"
    date: "2026-09-07"
    documents: 35
    change: "Baseline. 33 extracted circulars plus two curated tables (OC 208 SecC evidence map,
             OC 184B RGNB response table) rebuilt from the rulebook because OCR flattens a table
             into running text."

  - version: "corpus-v1.1"
    date: "2026-09-08"
    documents: 36
    change: "OC 208A Annexure A reconciled against the verified rulebook and added as a third
             curated record superseding the damaged scan - 15 of its 28 reject codes were wrong
             or missing. Every correction itemised in oc_208a_reconciliation.yaml. The scan is
             kept, superseded rather than overwritten."

  - version: "corpus-v1.2"
    date: "2026-09-09"
    documents: 36
    change: "Verdict band moved from per-row text to record-level metadata."
    why: "The NVB/NVR band was rendered as a line on every reject row. It is correct - it is the
          categorisation the verifier depends on - but it is identical across all 26 NVR codes,
          so as retrievable text it diluted the one thing that distinguishes those rows: their
          reason string. It made near-duplicate rows MORE similar, which is the opposite of what
          the near-duplicate queries measure, and it cost four queries (h15, h22, h32, q25) on
          structure_aware - the exact cell the first-stage diagnosis targets.

          Same defect class as two earlier ones: the B3 table-vs-row artifact, where a chunker
          scores a hit by retrieving a whole table without isolating the row, and the RC_1064
          tokenizer bug, where an identifier the corpus wrote as RC_1064 could never meet a
          question that said 'RC 1064'. In all three, something correct at one layer became a
          retrieval hazard at another.

          METADATA RENDERED INTO RETRIEVABLE TEXT IS A RETRIEVAL HAZARD EVEN WHEN IT IS CORRECT.
          The categorisation itself is untouched: nrp_verdict_for_codes and
          nrp_verdict_against_codes are unchanged, the guard test still holds, and the band is
          now carried on the record's source_section and stated once in its header."
    also: "Per-row text is now the code and its reason string only. The per-row Source line, the
           OCR-reconciliation marker and the transcription note moved to the record header for
           the same reason - repeated boilerplate is repeated boilerplate whether or not it is
           the band. Provenance is not lost: every chunk still carries doc_id, source_section,
           source_path and page as metadata, which is where it belongs."

  - version: "corpus-v1.2b"
    date: "2026-09-09"
    documents: 36
    scope: "chunker change, not a corpus text change"
    change: "structure_aware's minimum-token merge floor now applies to PROSE only. A table row is
             an atomic unit at any length and is never fused into its neighbour."
    why: "STRUCTURE_MIN_TOKENS=24 exists to stop running prose fragmenting into slivers. Applied
          to a table it did the opposite of its job: once corpus-v1.2 stripped the uniform
          boilerplate, reject rows fell under the floor and adjacent near-duplicate codes fused -
          13 chunks each carrying two or three codes. A chunk holding 1156 and 1157 is not a
          citation unit, and a query about either cannot be scored against it. A six-token reason
          code and a six-token sentence fragment are the same length and different things, which
          is precisely the distinction structure_aware exists to encode.

          Implemented by splitting the boundary patterns into _ROW_BOUNDARIES (reason-code
          entries, RGNB rows) and _PROSE_BOUNDARIES; a row boundary always closes the preceding
          chunk, a prose boundary still respects the floor. Prose chunking is structurally
          untouched - row patterns occur only in the three curated tables, plus one harmless
          table header in OC 206A whose smallest chunk is 57 tokens."
    m6_note: "This re-opens the M6 structure_aware number, which was never frozen. The prior
              number was scored on fused near-duplicate chunks that violated structure_aware's
              own one-row-per-chunk premise on the reject and RGNB tables, so it measured
              something the strategy does not claim to do."
    result: "One row per chunk everywhere: reject 28 rows / 28 chunks, RGNB 9/9, evidence map
             12/12, zero multi-row chunks. h30 and q25 recovered as predicted. h24 and h32 broke.
             rule@5 on structure_aware/dense/bge stayed 0.640 - the expected >0.700 did NOT
             materialise. Reject rows now average 13 tokens, and the three CBS near-duplicates
             (1134/1135/1136) are 14, 13 and 10 tokens of nearly identical wording. Isolation
             fixed the fusion and exposed the opposite limit: a ten-token row carries too little
             text for a bi-encoder to separate it from its neighbours. Direct evidence for the
             parent-expansion question in the Stage 3 diagnosis."

  - version: "corpus-v1.3"
    date: "2026-09-09"
    documents: 36
    change: "The OC 184B RGNB curated record now renders VERBATIM source wording for all nine
             rows, the verbatim NA1/NA2 penalty cells, and the Annexure 1 trigger and
             deemed-acceptance prose - replacing the rulebook glosses it had been rendering."
    why: "The rulebook gloss is fine for prose but wrong in a corpus record: a chunk is scored on
          what the circular actually says, and an anchor keyed on our restatement scores a string
          the source does not contain. The gloss stays in caps.yaml as `meaning`; `source_text`
          carries the quoted cell and the record renders that."
    transcription_rule: "ND2's source cell reads 'P2m'. Normalised to 'P2M' and logged in
                         caps.yaml under rgnb_responses.transcription_rules - every other row in
                         the column reads P2M and P2M is the sub-type identifier used throughout
                         the rulebook, so this is a scan rendering artefact, not a distinct value.
                         Logged, not applied silently."
    still_glossed: "ND1/ND2 penalty cells. No query anchors them and they were not inferred from
                    NA1's verbatim 'Yes (Mandatory)'."

  - version: "corpus-v1.4"
    date: "2026-09-09"
    documents: 36
    change: "Metadata swept out of ROW text in all three curated records. 14 contaminated row
             chunks found and cleared: 12 evidence-map rows each carrying an identical per-row
             `Source:` line, the reject taxonomy's last row (1157) carrying the record's trailing
             Source line, and the RGNB table's last row (ND2) carrying 87 tokens of transcription
             note plus the trailing prose and Source."
    why: "Third instance of one defect. Stage 1 moved the NVB/NVR verdict band out of per-row
          text; Stage 1b fixed the fusion that caused; and then Stage 2's transcription note went
          straight back into row text and merged into ND2's chunk, voiding h01's Stage 3
          diagnosis - it was measuring an 87-token provenance note, not the row.

          The pattern each time: metadata that is CORRECT, rendered where it is retrieved.
          Trailing record-level text is the specific trap, because it merges into the last row.
          Substantive prose stays in the record but now sits BEFORE the rows; provenance moves to
          source_section, where the chunk already carries it as metadata.

          The transcription rule itself is not deleted - P2m -> P2M is still recorded in
          caps.yaml and now also on the RGNB record's source_section. Only its rendering moved.

          Guarded permanently: tests/test_chunking.py fails if any row chunk contains
          'Transcription rule', 'Source:', 'Verdict:', 'reconciliation', 'normalised' or
          'OCR-corrected', and a second test fails if one row chunk grows to four times the
          median, which is what trailing text merging always looks like."
    result: "0 of 50 row chunks contaminated. ND2 back to 27 tokens from 113. h01's corrected
             ranks are >200 under all three embeddings - WORSE than the contaminated 126/157/129,
             because the note it was carrying included the prose 'otherwise the adjustment window
             will be closed on deemed acceptance', which is the semantic bridge to a question
             about silence meaning agreement. h01 is a genuine CHUNK case and a stronger one than
             the contaminated measurement suggested. h10 moved the other way and is now FOUND
             (e5 rank 1), so the Stage 3 tally becomes 3 FOUND / 1 DEPTH / 5 EMBEDDING / 2 CHUNK."
